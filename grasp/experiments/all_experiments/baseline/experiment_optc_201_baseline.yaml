dataset:
  name: optc_201
experiment_prefix: optc_201_baseline
storage:
  graph_root_dir: ./data/graphs/optc_201
graph_management:
  force_reload: false
ground_truth:
  base_dir: ./ground_truth/optc_201
times:
  train_start: ["2019-09-16 00:00:00"]
  train_end: ["2019-09-22 23:59:59"]
  test_start: ["2019-09-23 00:00:00"]
  test_end: ["2019-09-25 23:59:59"]
  context_size: 120 # in minutes
  step_size: 120 # in minutes
location_transformer:
  max_location_length: 1
  hidden_dim: 8
  embedding_dim: 4 
  num_layers: 2
  nhead: 4
  num_epochs: 1
  patience: 3
  batch_size: 1000
  positional_encoding_max_len: 5000
  positional_encoding_div_term_hyperparam: 10000.0
  learning_rate: 0.001
  device: cuda:1
detection:
  num_neighbors: [-1,-1]
  batch_size: 64
  epochs: 4
  device: cuda:1
  learning_rate: 0.01
  hidden_dim: 128
  heads: 4
  num_layers: 2
  dropout: 0.1
  weight_decay: 0.0001
  scheduler_factor: 0.5
  scheduler_patience: 5
  scheduler_mode: min
  shuffle_train_paths: true
  shuffle_train_batches: true
attack_windows_for_visualization:
  - start_time: "2019-09-23 11:23:00"
    end_time: "2019-09-23 15:30:59"