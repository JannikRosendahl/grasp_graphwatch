dataset:
  name: theia_e3
experiment_prefix: theia_e3_default_experiment_20_20
storage:
  graph_root_dir: ./data/graphs/theia_e3
graph_management:
  force_reload: false
ground_truth:
  base_dir: ./ground_truth/theia_e3
times:
  train_start: ["2018-04-03 00:00:00"]
  train_end: ["2018-04-09 23:59:59"]
  test_start: ["2018-04-10 00:00:00"]
  test_end: ["2018-04-13 23:59:59"]
  context_size: 120 # in minutes
  step_size: 120 # in minutes
location_transformer:
  max_location_length: 100
  hidden_dim: 16
  embedding_dim: 8 
  num_layers: 2
  nhead: 4
  num_epochs: 10
  patience: 3
  batch_size: 32
  positional_encoding_max_len: 5000
  positional_encoding_div_term_hyperparam: 10000.0
  learning_rate: 0.001
  device: cuda
detection:
  num_neighbors: [20,20]
  batch_size: 32
  epochs: 4
  device: cuda
  learning_rate: 0.01
  hidden_dim: 128
  heads: 4
  num_layers: 2
  dropout: 0.1
  weight_decay: 0.0001
  scheduler_factor: 0.5
  scheduler_patience: 5
  scheduler_mode: min
  shuffle_train_paths: true
  shuffle_train_batches: true
attack_windows_for_visualization:
  - start_time: "2018-04-10 13:41:00"
    end_time: "2018-04-10 14:55:59"
  - start_time: "2018-04-12 12:44:00"
    end_time: "2018-04-12 13:26:59"